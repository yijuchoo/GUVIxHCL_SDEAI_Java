# App runs on the same port used in our live-coded projects
server.port=9000

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/subscription_manager?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Settings
app.jwt.expirationMinutes=600
app.jwt.secret=i-am-a-super-secret-i-am-a-super-secret-i-am-a-super-secret

#logging.level.root=debug