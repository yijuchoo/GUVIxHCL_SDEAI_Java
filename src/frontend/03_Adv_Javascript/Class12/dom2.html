<!doctype html>
<html lang="en">
  <head>
    <title>DOM 2</title>
    <style>
      .active {
        background-color: firebrick;
        color: white;
        padding: 20px;
        border: 5px solid green;
      }
    </style>
  </head>
  <body>
    <div id="card">Product Card</div>
    <br />

    <img
      src="https://images.unsplash.com/photo-1779766342185-677b42fd175d?q=80&w=2340&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      alt=""
      width="500"
      id="photo"
    /><br /><br />

    <button onclick="changeImage()">Change Image</button>
    <button onclick="toggleImage()">Toggle image</button>
    <button onclick="toggleImage1()">Toggle image 1</button>
    <br /><br />
    <button onclick="addClass()">Add Style</button>
    <button onclick="removeClass()">Remove Style</button>
    <button onclick="toggleClass()">Add/Remove Style</button>

    <script>
      function addClass() {
        const card = document.getElementById("card");
        card.classList.add("active");
      }

      function removeClass() {
        const card = document.getElementById("card");
        card.classList.remove("active");
      }

      function toggleClass() {
        const card = document.getElementById("card");
        card.classList.toggle("active");
      }

      function changeImage() {
        const phtoto = document.getElementById("photo");
        phtoto.src =
          "https://images.unsplash.com/photo-1779202568356-a8239fd66d86?q=80&w=1925&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D";
      }

      function toggleImage() {
        const photo = document.getElementById("photo");

        if (photo.style.display === "none") {
          photo.style.display = "block";
        } else {
          photo.style.display = "none";
        }
      }

      function toggleImage1() {
        const photo = document.getElementById("photo");

        if (photo.src.includes("image1.jpg")) {
          photo.src = "image2.jpg";
        } else {
          photo.src = "image1.jpg";
        }
      }
    </script>
  </body>
</html>
