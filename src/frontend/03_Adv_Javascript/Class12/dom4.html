<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <style>
      .card {
        width: 200px;
        padding: 20px;
        margin: 5px;
        background-color: lightblue;
      }

      .hero {
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="card">Product 1</div>
    <div class="card">Product 2</div>
    <div class="card">Product 3</div>
    <div class="card">Product 4</div>
    <div class="card">Product 5</div>
    <div class="card">Product 6</div>
    <br />

    <button onclick="submit()">Submit</button>
    <button onclick="hide()">Hide</button>

    <script>
      function submit() {
        const cards = document.getElementsByClassName("card");
        console.log(cards);
        // cards[0].style.backgroundColor = "orange";
        // cards[1].style.backgroundColor = "green";
        // cards[2].style.backgroundColor = "pink";

        // Changing all to orange
        /* for (let i = 0; i < cards.length; i++) {
          cards[i].style.backgroundColor = "orange";
        } */

        for (let i = 0; i < cards.length; i++) {
          if (i < 2) {
            cards[i].style.backgroundColor = "maroon";
            cards[i].classList.add("hero");
          } else if (i < 4) {
            cards[i].style.backgroundColor = "lightgreen";
            cards[i].classList.remove("card");
          }
        }
      }

      function hide() {
        const cards = document.getElementsByClassName("card");
        for (let i = 0; i < cards.length; i++) {
          cards[i].style.display = "none";
        }
      }
    </script>
  </body>
</html>
