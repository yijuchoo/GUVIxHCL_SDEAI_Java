<script>
    let school = {
        students: [
            {
                name: "ram",
                subjects: ["html", "css"]
            },
            {
                name: "nishanth",
                subjects: ["javascript", "nodejs"]
            }
        ]
    };

    for(let student of school.students) {
        // student object
        for(let key in student) {
            console.log(key, ":", student[key])
        }
        // subject array
        for(let subject of student.subjects) {
            console.log(subject);
        }
    };
</script>
