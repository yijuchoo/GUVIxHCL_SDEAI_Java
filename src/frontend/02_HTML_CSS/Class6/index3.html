<!-- Semantic in HTML -> Describes the meaning of the content -->
<!-- 
    Semantic elements tell:
    browser -> what the content is
    developers -> What the content means
    Search Engine -> How the page is structured

    For search engine optimization, accessibility

    Semantic tags:
    header
    footer
    nav
    main
    article
    aside
    fugure
    figcaption
    summary
    address
    section
 -->
