<!doctype html>
<html>
  <head>
    <title>Document</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <!-- table tag -> tables are used to display data in rows and columns -->
    <!-- 
        tr -> table row
        td -> table data
     -->
    <table>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
      </tr>
      <tr>
        <td>Ram</td>
        <td>50</td>
        <td>Bangalore</td>
      </tr>
      <tr>
        <td>Ram</td>
        <td>50</td>
        <td>Bangalore</td>
      </tr>
      <tr>
        <td>Ram</td>
        <td>50</td>
        <td>Bangalore</td>
      </tr>
    </table>
  </body>
</html>
