<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        /* Borders are used to add borders around the HTML */
        h1 {
            border-style: dashed;
            border-style: dotted;
            border-style: double;
            border-style: solid;
            border-width: 5px;
            border-color: grey;
            border-color: orange green purple blue;
            /* top leftright bottom */
            border-color: orange green purple;
            /* topbottom leftright */
            border-color: orange purple;
            border-width: 10px 20px 30px 40px;
            border-style: dotted double solid groove;
            border: 2px dashed blue;

            /* padding - is used to provide the space around the content */
            padding-top: 10px;
            padding-left: 5px;
            padding-bottom: 40px;
            padding-right: 20px;
            padding: 10px 5px 40px 20px;
            padding: 10px 20px 30px;
            padding: 20px 40px;
            padding: 10px;

            /* margin - adding the space outside of the content/border */
            margin-top: 20px;
            margin-left: 50px;
            margin-bottom: 560px;
            margin-right: 40px;
            margin: 10px 20px 30px 40px;
            margin: 20px 40px 60px;
            margin: 20px 40px;
            margin: 50px;
            margin: 10px 20px 30px 40px;
        }

    </style>
</head>
<body>
    
    <h1>Something</h1>
    <!-- 
    Sequence:
        top
        right
        bottom
        left
    -->
</body>
</html>
