<!doctype html>
<html>
  <head>
    <title>Media Queries</title>
    <style>
      body {
        background-color: green;
      }

      h1 {
        font-size: 14px;
      }

      .box {
        width: 200px;
        height: 200px;
        background-color: white;
      }

      /* mobile */
      @media (min-width: 321px) and (max-width: 480px) {
        body {
          background-color: aqua;
        }

        .box {
          width: 200px;
          height: 400px;
          background-color: rgb(218, 10, 10);
          color: white;
        }
      }

      @media (min-width: 481px) and (max-width: 767px) {
        body {
          background-color: rgb(231, 130, 7);
        }

        .box {
          width: 200px;
          height: 400px;
          background-color: rgb(218, 10, 166);
          color: white;
        }
      }

      @media (min-width: 768px) and (max-width: 1024px) {
        body {
          background-color: rgb(28, 2, 232);
        }
      }

      @media (min-width: 1025px) and (max-width: 1200px) {
        h1 {
          font-size: 50px;
        }

        body {
          background-color: yellowgreen;
          background-image:url("https://static.guvi.in/cdn-cgi/image/metadata=keep,width=2048,height=455,f=auto,fit=cover/banner/bnr_d7d676cb3be00607bf0d5567dc251e71b35ce1e1_desktop_1776341109.webp");
          background-repeat: no-repeat;
          
        }
      }
    </style>
  </head>
  <body>
    <h1>Today is Saturday, enjoy the class!</h1>
    <div class="box">Something</div>
  </body>
</html>
