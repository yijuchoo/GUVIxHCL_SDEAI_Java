<!doctype html>
<html>
  <head>
    <title>Document</title>
    <style>
      h1 {
        color: green;
        color: pink;
        color: blue;
        color: #fff;
        background-color: aqua;
        background-color: orange;
        background-color: #0a547f;
      }
      p.one {
        background-color: rgb(25, 45, 2, 0.4);
        background-color: hsl(240, 40%, 60%);
        color: white;
        padding: 10px;
      }

      p.two {
        background-color: rgb(25, 45, 2, 0.5);
        background-color: hsl(340, 90%, 10%);
        opacity: 0.5;
        color: white;
        padding: 10px;
      }

      p.three {
        background-color: rgb(25, 45, 2, 0.6);
        color: white;
        padding: 10px;
      }

      h2 {
        padding: 20px;
        background: linear-gradient(red, yellow, orange, green);
      }

      h3 {
        padding: 100px;
        background: linear-gradient(to right, blue, pink, orange);
        background: linear-gradient(-45deg, red, orange, green);
        background: radial-gradient(red, yellow, pink, orange);
        background: radial-gradient(circle, orange, green);
        background: conic-gradient(red, orange, yellow, pink);
      }
    </style>
  </head>
  <body>
    <h1>Today is Friday</h1>
    <p class="one">This is a paragraph</p>
    <p class="two">This is a paragraph</p>
    <p class="three">This is a paragraph</p>
    <h2>This ia a heading</h2>
    <h3>This ia a heading</h3>
  </body>
</html>

<!-- 
    color

    1) named
    2) Hex colors -> Hex uses hexadecimal values #RRGGBB
    3) RGBA (Red, Green, Blue, Alpha/ Transparency) -> 0 to 255
    alpha -> 0 to 1 (0.1, 0.2, .... 1)
    4) HSL (Hue, Saturation, Lightness)
    h -> 0 to 360
    s -> 0% to 100%
    l -> 0% to 100%

    5) HSLA

-->
