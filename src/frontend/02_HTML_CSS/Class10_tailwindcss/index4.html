<!doctype html>
<html>
  <head>
    <title>Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="flex">
      <div class="bg-red-500 text-white p-5">BOX 1</div>
      <div class="bg-orange-500 text-white p-5">BOX 2</div>
      <div class="bg-green-500 text-white p-5">BOX 3</div>
    </div>
    <br />
    <div class="flex flex-row gap-4">
      <div class="bg-red-500 text-white p-5">BOX 1</div>
      <div class="bg-orange-500 text-white p-5">BOX 2</div>
      <div class="bg-green-500 text-white p-5">BOX 3</div>
    </div>
    <br />
    <div class="flex flex-col gap-4">
      <div class="bg-red-500 text-white p-5">BOX 1</div>
      <div class="bg-orange-500 text-white p-5">BOX 2</div>
      <div class="bg-green-500 text-white p-5">BOX 3</div>
    </div>

    <br />
    <hr />
    <br />
    <div class="flex justify-between bg-gray-300 gap-4">
      <div class="bg-orange-500 text-white p-5">Logo</div>
      <div class="bg-green-500 text-white p-5">Menu</div>
      <div class="bg-purple-500 text-white p-5">Details</div>
    </div>
    <br />
    <div class="flex justify-center bg-gray-300 flex-row gap-4">
      <div class="bg-red-500 text-white p-5">BOX 1</div>
      <div class="bg-orange-500 text-white p-5">BOX 2</div>
      <div class="bg-green-500 text-white p-5">BOX 3</div>
    </div>
    <br />
    <div class="flex h-60 items-center bg-gray-300">
      <div class="bg-red-500 text-white p-5">Center vertically</div>
    </div>
    <br />

    <div class="flex gap-8">
      <div class="bg-red-500 text-white p-5">1</div>
      <div class="bg-blue-500 text-white p-5">2</div>
      <div class="bg-green-500 text-white p-5">3</div>
    </div>
  </body>
</html>
